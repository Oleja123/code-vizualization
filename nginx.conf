server {
    listen 80;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie            $http_cookie;
    proxy_pass_header Set-Cookie;

    # ── Внутренний суброзапрос для проверки сессии ──────────────
    location = /_auth_check {
        internal;
        proxy_pass              http://auth-service:8083/api/auth/me;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length  "";
        proxy_set_header        X-Original-URI  $request_uri;
        proxy_set_header        Cookie          $http_cookie;
        # Если auth-service недоступен — возвращаем 401 а не 502
        proxy_intercept_errors  on;
        error_page 500 502 503 504 =401 /dev/null;
    }

    # ── Публичные эндпоинты ──────────────────────────────────────
    location /api/auth/ {
        proxy_pass http://auth-service:8083;
    }

    location / {
        proxy_pass http://frontend:80;
    }

    # ── Защищённые эндпоинты ─────────────────────────────────────
    location /api/flowchart/ {
        auth_request      /_auth_check;
        error_page 401  = @unauthorized;
        error_page 502  = @service_unavailable;
        error_page 503  = @service_unavailable;
        proxy_pass http://flowchart-visualizer:8081;
    }

    location /api/metrics/ {
        auth_request      /_auth_check;
        error_page 401  = @unauthorized;
        error_page 502  = @service_unavailable;
        error_page 503  = @service_unavailable;
        proxy_pass http://metrics-service:8085;
    }

    location /api/interpreter/ {
        auth_request      /_auth_check;
        error_page 401  = @unauthorized;
        error_page 502  = @service_unavailable;
        error_page 503  = @service_unavailable;
        proxy_pass http://interpreter:8080;
    }

    location /api/snapshot {
        auth_request      /_auth_check;
        error_page 401  = @unauthorized;
        error_page 502  = @service_unavailable;
        error_page 503  = @service_unavailable;
        proxy_http_version 1.1;
        proxy_pass http://interpreter:8080/snapshot;
    }

    location /api/cppcheck/ {
        auth_request      /_auth_check;
        error_page 401  = @unauthorized;
        error_page 502  = @service_unavailable;
        error_page 503  = @service_unavailable;
        proxy_pass http://cppcheck-analyzer:8086;
    }

    location /api/analyze {
        auth_request      /_auth_check;
        error_page 401  = @unauthorized;
        error_page 502  = @service_unavailable;
        error_page 503  = @service_unavailable;
        proxy_http_version 1.1;
        proxy_pass http://cppcheck-analyzer:8086/analyze;
    }

    # ── JSON-ответы при ошибках ───────────────────────────────────
    location @unauthorized {
        add_header Content-Type application/json always;
        return 401 '{"error":"Unauthorized"}';
    }

    location @service_unavailable {
        add_header Content-Type application/json always;
        return 503 '{"error":"Service unavailable"}';
    }
}